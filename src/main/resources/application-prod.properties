spring.config.import=optional:file:.env.local

# Local file storage configuration
file.storage.upload-dir=${FILE_STORAGE_UPLOAD_DIR:/data/ilas/uploads}

# Local database settings
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
## Use a generic MySQL dialect that is compatible with the Hibernate version bundled by Spring Boot
## (MySQL8Dialect caused a ClassNotFoundException in the deployed environment).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Local logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# CORS allowlist for local development
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

