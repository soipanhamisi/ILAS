spring.config.import=optional:file:.env.local

# Local file storage configuration
file.storage.provider=local
file.storage.upload-dir=storage/exam-assessments

# Local database settings
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# Local logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# CORS allowlist for local development
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

