spring.config.import=optional:file:.env[.properties]

spring.application.name=ILAS
server.port=${ILAS_SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# File upload settings for exam assessments
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.storage.upload-dir=${FILE_STORAGE_UPLOAD_DIR:storage/exam-assessments}

# Health/readiness checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Runtime monitoring settings for admin dashboard
server.tomcat.threads.max=200
monitoring.sample-interval-ms=5000
monitoring.active-user-timeout-ms=120000
monitoring.history.max-points=72

# Auto-grading LLM settings (Gemini by default)
grading.llm.provider=${GRADING_LLM_PROVIDER:gemini-studio}
grading.llm.endpoint-url=${GRADING_LLM_ENDPOINT_URL:https://generativelanguage.googleapis.com/v1beta/models}
grading.llm.api-key=${GRADING_LLM_API_KEY:${GEMINI_STUDIO_API_KEY:}}
grading.llm.model=${GRADING_LLM_MODEL:${GEMINI_STUDIO_MODEL:gemini-2.0-flash}}
grading.llm.timeout-seconds=${GRADING_LLM_TIMEOUT_SECONDS:30}
grading.llm.temperature=${GRADING_LLM_TEMPERATURE:0.0}

# Gemini Studio credentials
grading.llm.gemini.endpoint-url=${GEMINI_STUDIO_ENDPOINT_URL:https://generativelanguage.googleapis.com/v1beta/models}
grading.llm.gemini.api-key=${GEMINI_STUDIO_API_KEY:${GRADING_LLM_API_KEY:}}
grading.llm.gemini.model=${GEMINI_STUDIO_MODEL:gemini-2.0-flash}

# CORS allowlist for frontend origins (comma-separated). Patterns are supported.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4173}
