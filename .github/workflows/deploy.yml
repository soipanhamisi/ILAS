name: Deploy to GCP VM

on:
  push:
    branches:
      - gcp-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -e
            cd IntelligentLearnerAssessmentSystem/ILAS
            git pull https://github.com/soipanhamisi/ILAS.git gcp-deployment 
            cd ..
            echo "DB_URL=${{ vars.DB_URL }}" > env
            echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> env
            echo "" >> env
            echo "FILE_STORAGE_PROVIDER=${{ vars.FILE_STORAGE_PROVIDER }}" >> env
            echo "FILE_STORAGE_UPLOAD_DIR=${{ vars.FILE_STORAGE_UPLOAD_DIR }}" >> env
            echo "" >> env
            echo "ILAS_SERVER_PORT=${{ secrets.ILAS_SERVER_PORT }}" >> env
            echo "GRADING_LLM_PROVIDER=${{ vars.GRADING_LLM_PROVIDER }}" >> env
            echo "GEMINI_STUDIO_ENDPOINT_URL=${{ vars.GEMINI_STUDIO_ENDPOINT_URL }}" >> env
            echo "GEMINI_STUDIO_MODEL=${{ vars.GEMINI_STUDIO_MODEL }}" >> env
            echo "GEMINI_STUDIO_API_KEY=${{ secrets.GEMINI_STUDIO_API_KEY }}" >> env

            sudo -n docker compose build backend
            sudo -n docker compose build frontend
            sudo -n docker compose up -d --no-deps --force-recreate backend
            sudo -n docker compose up -d --no-deps --force-recreate frontend
            sudo -n docker compose up -d mysql
            sudo -n docker compose ps

